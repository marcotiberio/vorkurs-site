# Pages CMS configuration — https://pagescms.org/docs
media:
  input: static
  output: /
content:
  - name: site
    label: vorkurs.space
    type: file
    path: content/site.json
    format: json
    fields:
      - name: hero
        label: Intro (large text at the top)
        type: text
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Section title
            type: string
          - name: style
            label: Style
            type: select
            default: service
            description: "Plain = heading + text. Way of working = heading – label, italic intro, text. Case study = heading, role, text, link."
            options:
              values:
                - { name: service, label: Plain }
                - { name: way, label: Way of working }
                - { name: case, label: Case study }
                - { name: principle, label: Principle }
          - name: items
            label: Items
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{heading}"
            fields:
              - name: visible
                label: Show on site
                type: boolean
                default: true
                description: Untick to hide this item without deleting it.
              - name: heading
                label: Heading (grey)
                type: string
              - name: label
                label: Label after the dash (way of working only, e.g. Fixed scope)
                type: string
              - name: subheading
                label: Role / subtitle (case study only)
                type: string
              - name: intro
                label: Italic intro (way of working only)
                type: string
              - name: text
                label: Text
                type: text
                description: Empty line = new paragraph. Links as [text](https://…).
              - name: link_label
                label: Link label (case study only)
                type: string
              - name: link_url
                label: Link URL (case study only)
                type: string
              - name: link_visible
                label: Show link
                type: boolean
                default: true
      - name: logos
        label: Logo strip (above the footer)
        type: object
        fields:
          - name: visible
            label: Show on site
            type: boolean
            default: true
          - name: title
            label: Title
            type: string
            description: Optional, e.g. Trusted by. Empty = no title.
          - name: items
            label: Logos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: visible
                label: Show on site
                type: boolean
                default: true
              - name: name
                label: Name
                type: string
                description: Used as the image description, and shown as text when there's no image.
              - name: image
                label: Logo
                type: image
                description: SVG or transparent PNG, ideally single-colour. It's shown in grey and turns to full colour on hover when linked.
              - name: scale
                label: Size
                type: number
                default: 1
                description: Makes this logo bigger or smaller than the rest, e.g. 1.5 for square or stacked logos. 1 = normal.
              - name: url
                label: Link
                type: string
                description: Optional, e.g. https://earth-ai.com/
      - name: footer
        label: Footer
        type: object
        fields:
          - name: cta
            label: Closing line
            type: text
            description: Links as [text](mailto:…) or [text](https://…).
          - name: phone
            label: Phone
            type: string
          - name: address
            label: Studio address
            type: text
      - name: email
        label: Email (header, footer)
        type: string
      - name: nav_label
        label: Header link text
        type: string
      - name: title
        label: Site name
        type: string
      - name: url
        label: Site address
        type: string
        description: Full address with trailing slash, e.g. https://vorkurs.space/
      - name: seo
        label: SEO & link previews
        type: object
        fields:
          - name: title
            label: Page title
            type: string
            description: Shown in the browser tab and as the headline in Google. Aim for under 60 characters. Empty = site name.
          - name: description
            label: Meta description
            type: text
            description: The snippet under the headline in Google. Aim for 120–160 characters.
          - name: share_title
            label: Share title
            type: string
            description: Headline for link previews (LinkedIn, WhatsApp, Slack, X…). Empty = page title.
          - name: share_description
            label: Share description
            type: text
            description: Text for link previews. Empty = meta description.
          - name: image
            label: Share image
            type: image
            description: Picture for link previews. 1200 × 630 px, PNG or JPG.
          - name: image_alt
            label: Share image description
            type: string
            description: Describes the share image for screen readers.
          - name: language
            label: Language code
            type: string
            default: en
            description: e.g. en, nl, de.
          - name: twitter
            label: X / Twitter handle
            type: string
            description: Optional, e.g. @vorkurs.
          - name: noindex
            label: Hide from search engines
            type: boolean
            default: false
            description: Tick to ask Google & co. not to list the site (e.g. while it's in progress).