# Pages CMS configuration: https://pagescms.org/docs
# Every key in content/*.json must be listed here: Pages CMS drops fields it doesn't know about when it saves.
media:
  - name: images
    label: Images & videos
    input: img
    output: img
  - name: logos
    label: Logos
    input: assets/logos
    output: assets/logos

content:
  # ---------------------------------------------------------------- site
  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: name, label: Studio name, type: string, description: Logo text and the end of every page title. }
      - { name: url, label: Site address, type: string, description: "e.g. https://vorkurs.space (no trailing slash)" }
      - { name: description, label: Default description, type: text, description: For search results and link previews when a page has none of its own. }
      - { name: share_image, label: Link preview image, type: image, options: { media: images }, description: "Shown when the site is shared. 1200×630 works best." }
      - { name: email, label: Email, type: string }
      - { name: phone, label: Phone, type: string }
      - { name: address, label: Studio address, type: text, description: One line per line. }
      - name: nav
        label: Navigation
        type: object
        fields:
          - { name: work, label: Work link, type: string }
          - { name: approach, label: Approach link, type: string }
          - { name: approach_note, label: Approach note (small text in the menu), type: string }
          - { name: contact, label: Contact link (menu), type: string }
          - { name: touch, label: Contact link (bar), type: string }
          - { name: cta, label: Call to action, type: string, description: Menu button, also used in the home hero. }
      - { name: closing, label: Closing line (above the footer), type: text, description: "Links as [text](url). [Get in touch.](#contact) jumps to the contact details." }

  # ---------------------------------------------------------------- home
  - name: home
    label: Home
    type: file
    path: content/home.json
    format: json
    fields:
      - { name: title, label: Page title, type: string, description: Leave empty to use the studio name. }
      - { name: description, label: Description, type: text, description: Leave empty to use the default. }
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: title, label: Headline, type: text }
          - { name: subtitle, label: "Headline, grey part", type: text }
          - { name: show_contact, label: Show call to action and contact line, type: boolean, default: false }
          - { name: note, label: Small note, type: text, description: "*text* for italic." }
          - { name: show_note, label: Show small note, type: boolean, default: false }
      - name: logos
        label: Client logos
        type: object
        list:
          collapsible: { collapsed: true, summary: "{name}" }
        fields:
          - { name: visible, label: Show on site, type: boolean, default: true }
          - { name: name, label: Name, type: string, description: Read out to screen readers. }
          - { name: image, label: Logo, type: image, options: { media: logos } }
          - { name: height, label: Height in px (desktop), type: number, default: 24, description: "Tune per logo so they look the same size: about 24 for wordmarks, 38 for square marks." }
          - { name: height_mobile, label: Height in px (mobile), type: number, default: 18 }
          - { name: mono, label: Force black, type: boolean, default: false, description: For colour logos that have no black version. }
      - { name: work_title, label: Work section title, type: string }
      - name: cases
        label: Case studies
        type: object
        list:
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - { name: visible, label: Show on site, type: boolean, default: true }
          - { name: id, label: Short id, type: string, description: "Lowercase, no spaces. Used for the full-case link, e.g. vorkurs.space/#citizenm" }
          - { name: title, label: Title, type: string }
          - { name: meta, label: Details (top right), type: string, list: true, description: "e.g. client or partner, then the discipline." }
          - { name: outcome, label: Outcome, type: text }
          - name: layout
            label: Media layout
            type: select
            default: feature
            options:
              values:
                - { name: feature, label: "Large + stacked (first item large, the rest beside it)" }
                - { name: two, label: Two side by side }
                - { name: three, label: Three side by side }
                - { name: pano, label: Wide + two below }
                - { name: text, label: "Two + text (text sits in the third column)" }
          - &media
            name: media
            label: Media
            type: object
            list:
              collapsible: { collapsed: true, summary: "{caption}" }
            fields:
              - name: type
                label: Type
                type: select
                default: image
                options:
                  values:
                    - { name: image, label: Image }
                    - { name: video, label: "Video (plays muted, on loop)" }
                    - { name: halftone, label: "Halftone tool (live, from this image)" }
              - { name: src, label: File, type: file, options: { media: images } }
              - { name: alt, label: Description, type: string, description: "What's in the image, for screen readers." }
              - { name: caption, label: Caption, type: string }
              - name: frame
                label: Frame
                type: select
                default: plain
                options:
                  values:
                    - { name: plain, label: "Plain (fills the space)" }
                    - { name: shot, label: "Screenshot (16:10, top aligned)" }
                    - { name: wide, label: Wide (16:9) }
                    - { name: phoneish, label: Tall (portrait) }
                    - { name: phone, label: In a phone }
          - { name: text, label: Text, type: text, description: "Empty line = new paragraph. Links as [text](url)." }
          - { name: link_label, label: Link text, type: string, description: "e.g. brandmelder.org ↗" }
          - { name: link_url, label: Link address, type: string, description: "Ignored when there's a full case; the link opens that instead." }
          - name: full_case
            label: Full case (opens over the page)
            type: object
            fields:
              - { name: enabled, label: Has a full case, type: boolean, default: false }
              - { name: outcome, label: Outcome, type: text }
              - name: facts
                label: Facts
                type: object
                list:
                  collapsible: { collapsed: true, summary: "{label}" }
                fields:
                  - { name: label, label: Label, type: string }
                  - { name: value, label: Value, type: text, description: One line per line. }
              - name: blocks
                label: Blocks
                type: object
                list:
                  collapsible: { collapsed: true, summary: "{heading}" }
                fields:
                  - { name: heading, label: Heading, type: string, description: "Leave empty for a block without a heading or divider." }
                  - { name: text, label: Text, type: text, description: Empty line = new paragraph. }
                  - name: columns
                    label: Text columns
                    type: select
                    default: one
                    options:
                      values:
                        - { name: one, label: One }
                        - { name: two, label: Two }
                  - name: media_layout
                    label: Media layout
                    type: select
                    default: single
                    options:
                      values:
                        - { name: single, label: "Full width, one below the other" }
                        - { name: two, label: Two side by side }
                        - { name: three, label: Three side by side }
                        - { name: three-tall, label: "Three side by side, tall" }
                  - *media

  # ---------------------------------------------------------------- approach
  - name: approach
    label: Approach
    type: file
    path: content/approach.json
    format: json
    fields:
      - { name: title, label: Page title, type: string, description: "Shown as \"Title · vorkurs\"." }
      - { name: description, label: Description, type: text, description: Leave empty to use the default. }
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: title, label: Headline, type: text }
          - { name: subtitle, label: "Headline, grey part", type: text }
      - name: sections
        label: Sections
        type: object
        list:
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - { name: visible, label: Show on site, type: boolean, default: true }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text, description: "Optional. *text* for italic." }
          - name: items
            label: Items
            type: object
            list:
              collapsible: { collapsed: true, summary: "{heading}" }
            fields:
              - { name: visible, label: Show on site, type: boolean, default: true }
              - { name: heading, label: Heading, type: string }
              - { name: label, label: Label (grey, next to the heading), type: string, description: "Optional, e.g. Fixed scope" }
              - { name: lead, label: Italic intro, type: string, description: Optional. }
              - { name: text, label: Text, type: text, description: Empty line = new paragraph. }
